name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  public-tree:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject internal documentation and diagnostics
        shell: pwsh
        run: ./scripts/check-public-tree.ps1

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The MCP server and unit tests are net8.0 and need no Inventor SDK,
      # so they build and run on any runner. The per-version add-ins require
      # the Inventor interop assemblies and are built on a prepared Windows box.
      - name: Build server
        run: dotnet build src/server -c Release
      - name: Test (server-only)
        run: dotnet test tests/Bimwright.Ipt.Tests -c Release
      # Host-free model tests use net8.0. Real STA/WPF tests cover net48, net8 and net10;
      # windows-latest supplies .NET Framework 4.8, and setup-dotnet installs both modern SDKs.
      - name: Test (toast model)
        run: dotnet test tests/Bimwright.Ipt.Toast.Tests -c Release
      - name: Test (toast WPF)
        run: dotnet test tests/Bimwright.Ipt.Toast.Wpf.Tests -c Release

  installer:
    name: installer-${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated upgrade, rollback and uninstall
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/installer/upgrade.Tests.ps1 -ResultPath artifacts/installer-upgrade-${{ matrix.shell }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/installer/uninstall.Tests.ps1 -ResultPath artifacts/installer-uninstall-${{ matrix.shell }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.shell }}
          path: artifacts/installer-*.json
